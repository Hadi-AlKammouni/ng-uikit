<h3 class="props-table__title">{{ title }}</h3>
<div class="props-table__wrap">
  <table class="props-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Type</th>
        <th>Default</th>
        <th>Description</th>
      </tr>
    </thead>
    <tbody>
      @for (p of props; track p.name) {
        <tr>
          <td class="mono">{{ p.name }}</td>
          <td class="mono props-table__type">{{ p.type }}</td>
          <td class="mono props-table__default">{{ p.default ?? '—' }}</td>
          <td>{{ p.description }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
