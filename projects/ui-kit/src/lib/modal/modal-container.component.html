<div
  #trap
  class="uikit-modal"
  [class]="sizeClass"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="config.title ?? 'Dialog'"
>
  @if (config.title) {
    <header class="uikit-modal__header">
      <h2 class="uikit-modal__title">{{ config.title }}</h2>
      <button
        type="button"
        class="uikit-modal__close"
        aria-label="Close dialog"
        (click)="ref.close()"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </header>
  }
  <div class="uikit-modal__body">
    <ng-container #host />
  </div>
</div>
