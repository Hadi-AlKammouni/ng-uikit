<ul class="uikit-toast-list" role="region" aria-label="Notifications">
  @for (t of toasts(); track t.id) {
    <li
      class="uikit-toast"
      [class]="'uikit-toast--' + t.variant"
      [attr.role]="t.variant === 'danger' || t.variant === 'warning' ? 'alert' : 'status'"
      [attr.aria-live]="t.variant === 'danger' ? 'assertive' : 'polite'"
      data-uikit-toast
    >
      <div class="uikit-toast__body">
        @if (t.title) {
          <p class="uikit-toast__title">{{ t.title }}</p>
        }
        <p class="uikit-toast__message">{{ t.message }}</p>
      </div>
      <button
        type="button"
        class="uikit-toast__close"
        aria-label="Dismiss notification"
        (click)="dismiss(t.id)"
      >
        <svg
          width="12"
          height="12"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </li>
  }
</ul>
